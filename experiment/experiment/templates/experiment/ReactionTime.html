{{ block content }}

<p id="instruction" style="text-align:center; font-size: 20px; margin-bottom: 20px;">
  Press as quickly as possible when the button is no longer gray.
</p>

<div class="circle-container" style="position: relative; width: 400px; height: 400px; margin: 0 auto;">
  <div class="circle-button" id="center-circle" style="width:60px; height:60px; border-radius:50%; background-color:gray; border:1px solid #333; display:flex; justify-content:center; align-items:center; font-size:24px; font-weight:bold; color:black; position:absolute; top:170px; left:170px; cursor:pointer; transition: background-color 0.3s;">
    3
  </div>
  <div id="message" style="position:absolute; top:250px; left:50%; transform: translateX(-50%); font-size:16px; font-weight:bold; color:black; text-align:center;"></div>
</div>

{{ formfields }}

<script>
  const centerCircle = document.getElementById('center-circle');
  const message = document.getElementById('message');

  let isGreen = false;
  let waiting = false;
  let timeoutId = null;
  let stimulusShownAt = null;
  let trialIndex = 0;

  function showMessage(text) {
    message.innerText = text;
    setTimeout(() => {
      message.innerText = '';
    }, 1000);
  }

  function startTrial() {
    isGreen = false;
    waiting = true;
    stimulusShownAt = null;
    centerCircle.style.backgroundColor = 'gray';

    const delay = Math.random() * 6000 + 1000;
    timeoutId = setTimeout(() => {
      centerCircle.style.backgroundColor = '#005000';
      isGreen = true;
      waiting = false;
      stimulusShownAt = performance.now();
    }, delay);
  }

  function handleClick() {
    if (waiting && !isGreen) {
      clearTimeout(timeoutId);
      showMessage('Zu früh!');
      startTrial();
    } else if (isGreen) {
      const rt = performance.now() - stimulusShownAt;
      showMessage('Richtig!');

      liveSend({
        trial_index: trialIndex,
        reaction_time: rt.toFixed(2)
      });

      trialIndex++;
      isGreen = false;
      centerCircle.style.backgroundColor = 'gray';

      setTimeout(startTrial, 1000);
    }
  }

  centerCircle.addEventListener('click', handleClick);

  document.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') {
      handleClick();
    }
  });

  startTrial();

  setTimeout(() => {
    const submitBtn = document.querySelector('button[type=submit]');
    if (submitBtn) {
      submitBtn.click();
    } else {
      const form = document.querySelector('form');
      if (form) form.submit();
    }
  }, 60000);
</script>

{{ endblock }}
